name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run mechanism-diagnosis demo
        id: demo
        run: python demo/run_demo.py | tee demo_out.txt
      - name: Assert hit rate 7/7
        run: |
          grep -q "命中率：7/7" demo_out.txt
          echo "OK: 命中率 7/7"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-outputs
          path: |
            demo/out/demo_chart.png
            examples/diagnosis_sample.json
